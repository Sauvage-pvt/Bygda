<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bygda – finn laget ditt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fjord: #1b3a4b;
      --fjord-2: #102833;
      --moss: #3d6b4f;
      --gold: #d4a017;
      --clay: #c45c2d;
      --cream: #f3ead7;
      --paper: #fff8eb;
      --ink: #1a1612;
      --mute: #6d6458;
      --line: #e4d7bf;
      --ok: #1f7a45;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: #0b1014;
      color: var(--ink);
      display: flex;
      justify-content: center;
    }
    .device {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .status { display: none; }
    header.app {
      background: linear-gradient(180deg, var(--fjord), var(--fjord-2));
      color: var(--cream);
      padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      flex-shrink: 0;
    }
    .club { display: flex; align-items: center; gap: 12px; }
    .badge-crest {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(145deg, #7eb3c9, #2b6b82);
      color: #07151c; display: grid; place-items: center;
      font-family: Fraunces, serif; font-weight: 700; font-size: 18px;
    }
    header h1 { font-family: Fraunces, serif; font-size: 22px; line-height: 1.1; }
    header p { font-size: 13px; opacity: .75; }
    .wide-note { display: none; }
    .help-btn {
      width: 36px; height: 36px; border-radius: 12px;
      background: rgba(255,248,235,.12); color: var(--cream); font-weight: 800; flex-shrink: 0;
    }
    .screen {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 108px;
    }
    .split { display: grid; gap: 12px; }
    .hero, .card {
      background: var(--paper); border: 1px solid var(--line);
      border-radius: 18px; padding: 16px;
    }
    .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--moss); font-weight: 700; }
    h2 { font-family: Fraunces, serif; font-size: 26px; margin: 4px 0 8px; }
    h3 { font-family: Fraunces, serif; font-size: 18px; margin-bottom: 6px; }
    .muted { color: var(--mute); font-size: 14px; line-height: 1.45; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 700; border: 0; cursor: pointer;
      border-radius: 12px; padding: 11px 12px;
    }
    .primary { background: var(--fjord); color: var(--cream); }
    .clay { background: var(--clay); color: #fff; }
    .gold { background: var(--gold); color: #1a1612; }
    .ghost { background: transparent; border: 1px solid var(--line); color: var(--mute); }
    .grow { flex: 1; min-width: 120px; }
    .nav {
      position: absolute; left: 10px; right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      background: #fff8eb; border: 1px solid var(--line); border-radius: 22px;
      display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px;
    }
    .device { position: relative; }
    .nav button {
      background: transparent; color: var(--mute); font-size: 12px;
      padding: 8px 4px; display: flex; flex-direction: column; gap: 2px; align-items: center;
    }
    .nav button.on { color: var(--fjord); background: #efe4cc; }
    .pill { display: inline-block; background: #efe4cc; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .pills button { padding: 7px 10px; border-radius: 999px; background: #efe4cc; color: var(--ink); font-size: 13px; }
    .pills button.on { background: var(--fjord); color: var(--cream); }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px;
      padding: 12px; font: inherit; margin: 6px 0 10px;
    }
    .toast {
      position: absolute; left: 16px; right: 16px; top: 56px;
      background: var(--fjord); color: var(--cream); padding: 12px 14px;
      border-radius: 14px; display: none; z-index: 5;
    }
    .list-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px 0; border-bottom: 1px solid var(--line); gap: 10px;
    }
    .ok { color: var(--ok); font-weight: 700; }
    .wait { color: #9a6b12; font-weight: 700; }
    .stack { display: grid; gap: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat { background: #efe4cc; border-radius: 14px; padding: 10px; }
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 11px; color: var(--mute); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .action { background: #efe4cc; border-radius: 14px; padding: 14px 12px; text-align: left; color: var(--ink); }
    .action b { display: block; font-size: 15px; }
    .action span { font-size: 12px; color: var(--mute); font-weight: 400; }
    .faq { border-top: 1px solid var(--line); padding: 12px 0; }
    .faq:first-child { border-top: 0; padding-top: 0; }
    .faq button.q {
      width: 100%; text-align: left; background: transparent; color: var(--ink);
      padding: 0; display: flex; justify-content: space-between; gap: 12px; font-size: 16px;
    }
    .cost { background: #f6e4d4; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 8px 0; }
    .org-km { font-family: Fraunces, serif; font-size: 18px; color: var(--fjord); white-space: nowrap; }
    @media (min-width: 820px) {
      body { padding: 12px; background:
        radial-gradient(900px 420px at 80% -10%, #2a4a5c 0%, transparent 55%), #0b1014; }
      .device {
        width: min(1120px, 100%);
        height: calc(100dvh - 24px);
        border-radius: 28px;
        border: 10px solid #1c1814;
        box-shadow: 0 40px 80px rgba(0,0,0,.45);
      }
      .status {
        display: flex; height: 26px; background: var(--fjord); color: #d7c9a8;
        font-size: 11px; align-items: center; justify-content: space-between;
        padding: 0 18px; letter-spacing: .08em; flex-shrink: 0;
      }
      header.app { padding: 10px 18px 14px; }
      .wide-note { display: block; font-size: 12px; opacity: .7; text-align: right; max-width: 280px; }
      .split { grid-template-columns: 1.1fr .9fr; align-items: start; }
      .screen { padding: 20px 22px 108px; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="status"><span>15:18</span><span>BYGDA · TELEFON OG PAD</span><span>5G</span></div>
    <header class="app">
      <div class="club">
        <div class="badge-crest">B</div>
        <div>
          <h1>Bygda</h1>
          <p id="stedlinje">Egge og omegn</p>
        </div>
      </div>
      <div class="wide-note">Finn lag, verv og det som skjer i uka. Du velger selv hvor langt unna.</div>
      <button class="help-btn" onclick="go('hjelp')">?</button>
    </header>
    <div class="toast" id="toast"></div>
    <div class="screen" id="screen"></div>
    <nav class="nav">
      <button class="on" data-go="hjem" onclick="go('hjem')">⌂<span>Hjem</span></button>
      <button data-go="sok" onclick="go('sok')">⌕<span>Søk</span></button>
      <button data-go="uka" onclick="go('uka')">▣<span>Uka</span></button>
      <button data-go="inviter" onclick="go('inviter')">✉<span>Inviter</span></button>
    </nav>
  </div>
<script>
  const KM_PER_MILE = 1.60934;
  const SMS_KR = 0.59;
  const state = {
    sted: "Egge",
    enhet: "km",
    radius: 20,
    q: "",
    type: "alle",
    alder: "alle",
    valgt: null,
    faq: "tjeneste",
    mine: [2],
    foresporsler: [],
    listeNavn: "Egge lagsliste 2026",
    manuell: "Egge IL;idrett;2;eggeil@example.no;97712334\nEgge historielag;kultur;6;historie@example.no;\n4H Egge;barn;4;4h.egge@example.no;90011223\nBygdekvinnelaget Egge;lokalsamfunn;8;bkl.egge@example.no;",
    inviter: { kanal: "epost", utvalg: "lista", tekst: "" },
    sendt: [],
    _side: "hjem"
  };

  const org = [
    { id: 1, navn: "Egge IL", type: "idrett", km: 1.2, medlem: 420, aapen: true, trenger: "Trenere G13", kort: "Fotball, ski og allidrett for barn og ungdom.", epost: "post@eggeil.no", tlf: "74123456", alder: "6–19" },
    { id: 2, navn: "Egge IL Gutter 13", type: "idrett", km: 1.2, medlem: 18, aapen: true, trenger: "Flere foreldre på dugnad", kort: "Ett av lagene i klubben.", epost: "g13@eggeil.no", tlf: "97712334", alder: "12–13" },
    { id: 3, navn: "4H Egge", type: "barn", km: 3.4, medlem: 34, aapen: true, trenger: "Klubbleder", kort: "Dyr, grøde og møte hver annen onsdag.", epost: "4h.egge@example.no", tlf: "90011223", alder: "8–16" },
    { id: 4, navn: "Egge historielag", type: "kultur", km: 2.1, medlem: 67, aapen: true, trenger: "Arkivhjelp", kort: "Gårdsarkiv, turer og årbok.", epost: "historie@example.no", tlf: "", alder: "Voksen" },
    { id: 5, navn: "Bygdekvinnelaget Egge", type: "lokalsamfunn", km: 2.8, medlem: 41, aapen: true, trenger: "Kasserer", kort: "Matkultur, husflid og møte i bygdehuset.", epost: "bkl.egge@example.no", tlf: "91555666", alder: "Voksen" },
    { id: 6, navn: "Speidergruppa Egge", type: "barn", km: 4.0, medlem: 22, aapen: true, trenger: "Ledere", kort: "Tirsdag i kjelleren på klubbhuset.", epost: "speider@example.no", tlf: "98877665", alder: "8–16" },
    { id: 7, navn: "Innherred kor", type: "kultur", km: 14.5, medlem: 28, aapen: true, trenger: "Tenorer", kort: "Øver i Steinkjer. Høstkonsert i november.", epost: "kor@example.no", tlf: "", alder: "16+" },
    { id: 8, navn: "Steinkjer jakt- og fiskelag", type: "lokalsamfunn", km: 16.2, medlem: 190, aapen: false, trenger: "", kort: "Medlemskap via årsmøte. Venteliste på jaktkort.", epost: "jff@example.no", tlf: "74110000", alder: "16+" },
    { id: 9, navn: "FAU Egge skole", type: "lokalsamfunn", km: 0.8, medlem: 12, aapen: true, trenger: "Klasseforeldre 5. trinn", kort: "Ikke et lag du melder deg inn i, men de trenger folk.", epost: "fau@egge-skole.no", tlf: "", alder: "Foreldre" },
    { id: 10, navn: "Pensjonistforeningen Egge", type: "lokalsamfunn", km: 1.9, medlem: 88, aapen: true, trenger: "Turleder", kort: "Onsdagskaffe og busstur en gang i måneden.", epost: "pensjon@example.no", tlf: "90099887", alder: "60+" },
    { id: 11, navn: "Verdal IL håndball", type: "idrett", km: 28.0, medlem: 210, aapen: true, trenger: "Dommere", kort: "Lenger unna. Vises bare om du utvider radius.", epost: "handball@verdalil.no", tlf: "", alder: "6–19" },
    { id: 12, navn: "Inderøy historielag", type: "kultur", km: 22.4, medlem: 54, aapen: true, trenger: "", kort: "Årbok og gårdsvandring.", epost: "inderoyhist@example.no", tlf: "", alder: "Voksen" }
  ];

  const hendelser = [
    { id: 1, dag: "I kveld", tid: "18:00", tittel: "4H-møte", lag: "4H Egge", orgId: 3, km: 3.4, type: "møte" },
    { id: 2, dag: "I kveld", tid: "19:00", tittel: "Korøving", lag: "Innherred kor", orgId: 7, km: 14.5, type: "øving" },
    { id: 3, dag: "Tirsdag", tid: "18:00", tittel: "Speidermøte", lag: "Speidergruppa Egge", orgId: 6, km: 4.0, type: "møte" },
    { id: 4, dag: "Onsdag", tid: "11:00", tittel: "Onsdagskaffe", lag: "Pensjonistforeningen", orgId: 10, km: 1.9, type: "treff" },
    { id: 5, dag: "Torsdag", tid: "17:00", tittel: "Åpent hus i bygdehuset", lag: "Bygdekvinnelaget", orgId: 5, km: 2.8, type: "åpent" },
    { id: 6, dag: "Lørdag", tid: "10:00", tittel: "Historielagstur", lag: "Egge historielag", orgId: 4, km: 2.1, type: "tur" }
  ];

  const typer = [
    { id: "alle", navn: "Alle" },
    { id: "idrett", navn: "Idrett" },
    { id: "barn", navn: "Barn" },
    { id: "kultur", navn: "Kultur" },
    { id: "lokalsamfunn", navn: "Lokalt" }
  ];

  function visKm(km) {
    if (state.enhet === "mil") return (km / 10).toFixed(1).replace(".", ",") + " mil";
    if (state.enhet === "miles") return (km / KM_PER_MILE).toFixed(1).replace(".", ",") + " mi";
    return km.toFixed(1).replace(".", ",") + " km";
  }
  function radiusKm() {
    if (state.enhet === "mil") return state.radius * 10;
    if (state.enhet === "miles") return state.radius * KM_PER_MILE;
    return state.radius;
  }
  function passerAlder(o) {
    if (state.alder === "alle") return true;
    const a = (o.alder || "").toLowerCase();
    if (state.alder === "barn") return a.includes("8") || a.includes("6") || a.includes("12") || a.includes("barn");
    if (state.alder === "ung") return a.includes("12") || a.includes("16") || a.includes("19");
    if (state.alder === "voksen") return a.includes("voksen") || a.includes("16+") || a.includes("foreldre") || a.includes("60");
    return true;
  }
  function filtrert() {
    const r = radiusKm();
    const q = state.q.trim().toLowerCase();
    return org.filter(o => {
      if (o.km > r) return false;
      if (state.type !== "alle" && o.type !== state.type) return false;
      if (!passerAlder(o)) return false;
      if (q && !(o.navn + " " + o.kort + " " + o.trenger).toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => a.km - b.km);
  }
  function go(name) {
    document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", ["hjem","sok","uka","inviter"].includes(name) && b.dataset.go === name));
    ({ hjem, sok, detalj, liste, inviter, hjelp, uka, verv, mine }[name] || hjem)();
    document.getElementById("screen").scrollTop = 0;
  }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2600);
  }
  function apne(id) {
    state.valgt = org.find(o => o.id === id);
    go("detalj");
  }
  function lagre(id) {
    if (state.mine.includes(id)) state.mine = state.mine.filter(x => x !== id);
    else state.mine.push(id);
    toast(state.mine.includes(id) ? "Lagt under Mine lag" : "Tatt bort");
  }
  function vilVaereMed(id) {
    const o = org.find(x => x.id === id);
    if (!state.foresporsler.includes(id)) state.foresporsler.push(id);
    toast("Forespørsel sendt til " + o.navn);
    detalj();
  }

  function hjem() {
    state._side = "hjem";
    const n = filtrert().length;
    const trenger = org.filter(o => o.trenger && o.km <= radiusKm());
    const uka = hendelser.filter(h => h.km <= radiusKm()).slice(0, 3);
    const mineLag = org.filter(o => state.mine.includes(o.id));
    document.getElementById("stedlinje").textContent = state.sted + " · " + state.radius + " " + state.enhet;
    document.getElementById("screen").innerHTML = `
      <section class="hero">
        <div class="kicker">Tjenester i ${state.sted}</div>
        <h2>Hva trenger du?</h2>
        <p class="muted">${n} lag innen ${state.radius} ${state.enhet}. ${trenger.length} søker folk. ${uka.length} treff i uka.</p>
        <div class="actions">
          <button class="action" onclick="go('sok')"><b>Finn lag</b><span>Søk og avstand</span></button>
          <button class="action" onclick="go('uka')"><b>Denne uka</b><span>Møter og turer</span></button>
          <button class="action" onclick="go('verv')"><b>Åpne verv</b><span>De trenger folk</span></button>
          <button class="action" onclick="go('mine')"><b>Mine lag</b><span>${mineLag.length} lagret</span></button>
          <button class="action" onclick="go('liste')"><b>Bygdas liste</b><span>Lim inn arket</span></button>
          <button class="action" onclick="go('inviter')"><b>Inviter</b><span>E-post eller SMS</span></button>
        </div>
      </section>
      <div class="split" style="margin-top:12px">
        <article class="card">
          <span class="pill">Nærmest nå</span>
          <h3>Denne uka</h3>
          ${uka.map(h => `
            <div class="list-row">
              <div>
                <b>${h.tittel}</b>
                <div class="muted">${h.dag} ${h.tid} · ${h.lag} · ${visKm(h.km)}</div>
              </div>
              <button class="ghost" onclick="apne(${h.orgId})">Lag</button>
            </div>`).join("") || `<p class="muted">Ingen treff innen radius.</p>`}
          <button class="ghost grow" style="margin-top:10px" onclick="go('uka')">Hele uka</button>
        </article>
        <article class="card">
          <span class="pill">${trenger.length} åpne</span>
          <h3>De trenger folk</h3>
          ${trenger.slice(0, 4).map(o => `
            <div class="list-row">
              <div>
                <b>${o.navn}</b>
                <div class="muted">${o.trenger} · ${visKm(o.km)}</div>
              </div>
              <button class="ghost" onclick="apne(${o.id})">Se</button>
            </div>`).join("")}
          <button class="ghost grow" style="margin-top:10px" onclick="go('verv')">Alle verv</button>
        </article>
      </div>
    `;
  }

  function radiusFelt(tilbake) {
    const steg = state.enhet === "mil" ? [1, 2, 3, 5] : state.enhet === "miles" ? [3, 6, 12, 30] : [5, 10, 20, 50];
    return `
      <div class="pills">
        ${["km", "mil", "miles"].map(e =>
          `<button class="${state.enhet === e ? "on" : ""}" onclick="state.enhet='${e}'; state.radius=${e === "mil" ? 2 : e === "miles" ? 12 : 20}; go('${tilbake}')">${e}</button>`
        ).join("")}
      </div>
      <div class="pills">
        ${steg.map(v =>
          `<button class="${Number(state.radius) === v ? "on" : ""}" onclick="state.radius=${v}; go('${tilbake}')">${v} ${state.enhet}</button>`
        ).join("")}
      </div>`;
  }

  function sok() {
    state._side = "sok";
    const list = filtrert();
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Organisasjonssøk</p>
      <h2>Finn laget</h2>
      <input id="qfelt" value="${state.q.replace(/"/g, """)}" placeholder="Navn, verv, kor, 4H…" oninput="state.q=this.value" onkeyup="if(event.key==='Enter')sok()" />
      <div class="row" style="margin-top:0"><button class="primary grow" onclick="sok()">Søk</button></div>
      ${radiusFelt("sok")}
      <div class="pills">
        ${typer.map(t => `<button class="${state.type === t.id ? "on" : ""}" onclick="state.type='${t.id}'; sok()">${t.navn}</button>`).join("")}
      </div>
      <div class="pills">
        ${[["alle","Alle aldre"],["barn","Barn"],["ung","Ungdom"],["voksen","Voksen"]].map(([id,n]) =>
          `<button class="${state.alder === id ? "on" : ""}" onclick="state.alder='${id}'; sok()">${n}</button>`
        ).join("")}
      </div>
      <p class="muted" style="margin-bottom:8px">${list.length} treff fra ${state.sted}.</p>
      ${list.map(o => `
        <article class="card" style="margin-bottom:10px">
          <span class="pill">${typer.find(t => t.id === o.type).navn}${o.aapen ? "" : " · stengt"}</span>
          <div class="list-row" style="border:0;padding:0">
            <div>
              <h3>${o.navn}</h3>
              <p class="muted">${o.kort}</p>
            </div>
            <div class="org-km">${visKm(o.km)}</div>
          </div>
          <p class="muted">${o.medlem} medlemmer · ${o.alder}${o.trenger ? " · søker: " + o.trenger : ""}</p>
          <div class="row">
            <button class="primary grow" onclick="apne(${o.id})">Åpne</button>
            <button class="ghost grow" onclick="lagre(${o.id}); sok()">${state.mine.includes(o.id) ? "Lagret" : "Lagre"}</button>
          </div>
        </article>`).join("") || `<article class="card"><p class="muted">Ingen lag innen ${state.radius} ${state.enhet}. Utvid radius.</p></article>`}
    `;
  }

  function uka() {
    const list = hendelser.filter(h => h.km <= radiusKm());
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Kalender</p>
      <h2>Denne uka</h2>
      <p class="muted">Bare det som ligger innen ${state.radius} ${state.enhet}.</p>
      ${radiusFelt("uka")}
      ${list.map(h => `
        <article class="card" style="margin-bottom:10px">
          <span class="pill">${h.dag} · ${h.tid}</span>
          <h3>${h.tittel}</h3>
          <p class="muted">${h.lag} · ${visKm(h.km)}</p>
          <div class="row">
            <button class="primary grow" onclick="toast('Satt i kalenderen (demo)')">Jeg kommer</button>
            <button class="ghost grow" onclick="apne(${h.orgId})">Om laget</button>
          </div>
        </article>`).join("") || `<article class="card"><p class="muted">Ingenting innen radius. Utvid.</p></article>`}
    `;
  }

  function verv() {
    const list = org.filter(o => o.trenger && o.km <= radiusKm());
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Rekruttering</p>
      <h2>Åpne verv</h2>
      <p class="muted">Ikke en stillingsportal. Bare lag som sier ifra at de mangler folk.</p>
      ${list.map(o => `
        <article class="card" style="margin-bottom:10px">
          <span class="pill">${visKm(o.km)}</span>
          <h3>${o.trenger}</h3>
          <p class="muted">${o.navn} · ${o.alder}</p>
          <div class="row">
            <button class="primary grow" onclick="vilVaereMed(${o.id})">Jeg kan bidra</button>
            <button class="ghost grow" onclick="apne(${o.id})">Laget</button>
          </div>
        </article>`).join("")}
    `;
  }

  function mine() {
    const list = org.filter(o => state.mine.includes(o.id));
    const fores = org.filter(o => state.foresporsler.includes(o.id));
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Ditt</p>
      <h2>Mine lag</h2>
      ${list.map(o => `
        <article class="card" style="margin-bottom:10px">
          <h3>${o.navn}</h3>
          <p class="muted">${o.kort}</p>
          <div class="row">
            <button class="primary grow" onclick="apne(${o.id})">Åpne</button>
            <button class="ghost grow" onclick="lagre(${o.id}); mine()">Fjern</button>
          </div>
        </article>`).join("") || `<article class="card"><p class="muted">Ingen lagret ennå. Trykk Lagre på et lag i søket.</p></article>`}
      <article class="card">
        <h3>Forespørsler</h3>
        ${fores.map(o => `<div class="list-row"><span>${o.navn}</span><span class="wait">Sendt</span></div>`).join("") || `<p class="muted">Ingen sendt.</p>`}
        <button class="ghost grow" style="margin-top:10px" onclick="go('liste')">Har bygda ei liste fra før?</button>
      </article>
    `;
  }

  function detalj() {
    const o = state.valgt;
    if (!o) return go("sok");
    const kommende = hendelser.filter(h => h.orgId === o.id);
    document.getElementById("screen").innerHTML = `
      <p class="kicker">${typer.find(t => t.id === o.type).navn} · ${visKm(o.km)}</p>
      <h2>${o.navn}</h2>
      <article class="card">
        <p class="muted">${o.kort}</p>
        <div class="stats">
          <div class="stat"><b>${o.medlem}</b><span>medlemmer</span></div>
          <div class="stat"><b>${o.alder}</b><span>alder</span></div>
          <div class="stat"><b>${o.aapen ? "Åpent" : "Stengt"}</b><span>inntak</span></div>
        </div>
        ${o.trenger ? `<p class="muted" style="margin-top:10px"><b>Søker:</b> ${o.trenger}</p>` : ""}
        <div class="row">
          <button class="primary grow" onclick="vilVaereMed(${o.id})">${state.foresporsler.includes(o.id) ? "Forespørsel sendt" : "Jeg vil være med"}</button>
          <button class="ghost grow" onclick="lagre(${o.id}); detalj()">${state.mine.includes(o.id) ? "Lagret" : "Lagre"}</button>
        </div>
      </article>
      ${kommende.length ? `<article class="card" style="margin-top:12px"><h3>Hos dem denne uka</h3>${kommende.map(h => `<div class="list-row"><span>${h.dag} ${h.tid} · ${h.tittel}</span><button class="ghost" onclick="toast('Satt i kalenderen (demo)')">Kommer</button></div>`).join("")}</article>` : ""}
      <article class="card" style="margin-top:12px">
        <h3>Kontakt</h3>
        <div class="list-row"><span>E-post</span><b>${o.epost || "—"}</b></div>
        <div class="list-row"><span>Telefon</span><b>${o.tlf || "Ikke oppgitt"}</b></div>
        <div class="row">
          <button class="ghost grow" onclick="state.valgt=o; go('inviter')">Inviter noen hit</button>
          <button class="ghost grow" onclick="go('sok')">Tilbake</button>
        </div>
      </article>
    `;
  }

  function parseListe() {
    return state.manuell.split("\\n").join("\n").split("\n").map(l => l.trim()).filter(Boolean).map((l, i) => {
      const [navn, type, km, epost, tlf] = l.split(";").map(s => (s || "").trim());
      return { i, navn, type: type || "ukjent", km: Number(km || 0), epost, tlf };
    });
  }

  function liste() {
    const rader = parseListe();
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Manuell liste</p>
      <h2>Har bygda lista fra før?</h2>
      <p class="muted">Lim inn arket. Ett lag per linje: navn;type;km;epost;mobil</p>
      <article class="card">
        <label class="muted">Listenavn</label>
        <input value="${state.listeNavn.replace(/"/g, """)}" oninput="state.listeNavn=this.value" />
        <textarea rows="7" oninput="state.manuell=this.value">${state.manuell}</textarea>
        <div class="row">
          <button class="primary grow" onclick="toast(parseListe().length + ' lag lest inn'); liste()">Les inn</button>
          <button class="ghost grow" onclick="go('inviter')">Inviter fra lista</button>
        </div>
      </article>
      <article class="card" style="margin-top:12px">
        <h3>${rader.length} i arket</h3>
        ${rader.map(r => `
          <div class="list-row">
            <div><b>${r.navn}</b><div class="muted">${r.type} · ${r.km} km · ${r.epost || "mangler e-post"}</div></div>
            <span class="${r.epost ? "ok" : "wait"}">${r.epost ? "E-post" : "Mangler"}</span>
          </div>`).join("")}
      </article>
    `;
  }

  function mottakere() {
    if (state.inviter.utvalg === "ett" && state.valgt) {
      return [{ navn: state.valgt.navn, epost: state.valgt.epost, tlf: state.valgt.tlf }];
    }
    return parseListe();
  }

  function inviter() {
    const m = mottakere();
    const medEpost = m.filter(x => x.epost);
    const medSms = m.filter(x => x.tlf);
    const smsKost = (medSms.length * SMS_KR).toFixed(2).replace(".", ",");
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Rekruttering</p>
      <h2>Inviter</h2>
      <p class="muted">E-post er inkludert. SMS koster ekstra og vises før du sender.</p>
      <article class="card">
        <div class="pills">
          <button class="${state.inviter.utvalg === "lista" ? "on" : ""}" onclick="state.inviter.utvalg='lista'; inviter()">Lista (${parseListe().length})</button>
          <button class="${state.inviter.utvalg === "ett" ? "on" : ""}" onclick="state.inviter.utvalg='ett'; inviter()">Ett lag</button>
        </div>
        <div class="pills">
          <button class="${state.inviter.kanal === "epost" ? "on" : ""}" onclick="state.inviter.kanal='epost'; inviter()">E-post</button>
          <button class="${state.inviter.kanal === "sms" ? "on" : ""}" onclick="state.inviter.kanal='sms'; inviter()">SMS</button>
          <button class="${state.inviter.kanal === "begge" ? "on" : ""}" onclick="state.inviter.kanal='begge'; inviter()">Begge</button>
        </div>
        ${state.inviter.kanal !== "epost" ? `<div class="cost">SMS til ${medSms.length} nummer ≈ <b>${smsKost} kr</b>. Styret ser prisen først.</div>` : `<p class="muted">${medEpost.length} har e-post. Ingen stykkpris.</p>`}
        <textarea rows="3" oninput="state.inviter.tekst=this.value" placeholder="Hei. Åpent hus torsdag i bygdehuset.">${state.inviter.tekst}</textarea>
        <button class="clay grow" onclick="sendInv()">${state.inviter.kanal === "sms" ? "Send SMS (" + smsKost + " kr)" : "Send"}</button>
      </article>
      <article class="card" style="margin-top:12px">
        <h3>Mottakere</h3>
        ${m.map(x => `<div class="list-row"><div><b>${x.navn}</b><div class="muted">${x.epost || "ingen e-post"} · ${x.tlf || "ingen mobil"}</div></div></div>`).join("")}
        <p class="muted" style="margin-top:10px">Demoen sender ikke ekte post eller SMS.</p>
      </article>
    `;
  }

  function sendInv() {
    const m = mottakere();
    if (state.inviter.kanal !== "epost" && !m.some(x => x.tlf)) return toast("Ingen mobilnummer");
    if (state.inviter.kanal !== "sms" && !m.some(x => x.epost)) return toast("Ingen e-post");
    state.sendt.unshift(m.length + " sendt");
    toast("Demo: " + m.length + " invitasjoner markert som sendt.");
    inviter();
  }

  function toggleFaq(id) {
    state.faq = state.faq === id ? "" : id;
    hjelp();
  }
  function hjelp() {
    const open = (id, q, body) => `
      <div class="faq">
        <button class="q" onclick="toggleFaq('${id}')"><span>${q}</span><span>${state.faq === id ? "−" : "+"}</span></button>
        ${state.faq === id ? `<div class="a" style="margin-top:8px">${body}</div>` : ""}
      </div>`;
    document.getElementById("screen").innerHTML = `
      <p class="kicker">Underlag</p>
      <h2>Hva Bygda gjør</h2>
      <article class="card">
        ${open("tjeneste", "Hvilke tjenester er med?", `
          <p class="muted">Finn lag med avstand. Kalender for uka. Åpne verv. Mine lag. Forespørsel «jeg vil være med». Manuell liste hvis bygda har et ark. Invitasjon på e-post, SMS mot synlig pris.</p>`)}
        ${open("sok", "Hvordan virker søket?", `
          <p class="muted">Du setter km, mil eller miles selv. Filter på type og alder. Lista er nærmest først.</p>`)}
        ${open("sms", "Hva koster SMS?", `
          <p class="muted">${SMS_KR.toString().replace(".", ",")} kr per melding i demoen. Ekte pris avhenger av leverandør. Ingen skjult trekk.</p>`)}
        ${open("ikke", "Hva Bygda ikke er", `
          <p class="muted">Ikke Facebook, ikke kassa, ikke nasjonalt register. Dugnad og Vipps hører til lagets egen app — og bare hvis laget selv blir lagt inn senere.</p>`)}
      </article>
    `;
  }

  hjem();
</script>
</body>
</html>
