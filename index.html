<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bygda – to demoer</title>
  <style>
    :root { --ink: #1a1612; --mute: #6d6458; --cream: #f3ead7; --paper: #fff8eb; --fjord: #1b3a4b; --clay: #c45c2d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0b1014;
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { width: min(760px, 100%); }
    h1 { color: var(--cream); font-size: 36px; margin-bottom: 6px; }
    .lede { color: #c9bba0; margin-bottom: 20px; }
    .grid { display: grid; gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    a.card {
      display: block;
      background: var(--paper);
      border-radius: 18px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #e4d7bf;
    }
    a.card:hover { outline: 2px solid var(--fjord); }
    .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #3d6b4f; font-weight: 700; }
    h2 { font-size: 22px; margin: 6px 0 8px; }
    p { color: var(--mute); line-height: 1.45; }
    .go { display: inline-block; margin-top: 14px; background: var(--fjord); color: var(--cream); font-weight: 700; padding: 10px 14px; border-radius: 12px; }
    .clay .go { background: var(--clay); }
  </style>
</head>
<body>
  <main>
    <h1>Bygda</h1>
    <p class="lede">To demoer. De er ikke samme app.</p>
    <div class="grid">
      <a class="card clay" href="lagkassa.html">
        <div class="kicker">Klubb</div>
        <h2>Lagkassa</h2>
        <p>Dugnad for Gutter 13. Vipps, pizzalodd, egg og henting. Demoen er simulert.</p>
        <span class="go">Åpne Lagkassa</span>
      </a>
      <a class="card" href="bygda.html">
        <div class="kicker">Bygd</div>
        <h2>Bygda</h2>
        <p>Finn lag i nærheten. Søk, avstand, uka og invitasjon. Data fra Enhetsregisteret.</p>
        <span class="go">Åpne Bygda</span>
      </a>
    </div>
  </main>
</body>
</html>
